# Publishes the panel (ui/) to GitHub Pages.
#
# Pages serves static files only, so the hosted panel is exactly ui/ — it talks
# to the visitor's own engine through the loopback bridge (ui/engine.js), so no
# build step and no bundler is needed here. A successful deploy-pages run is
# also what turns Pages on for the repository.
name: Deploy panel to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true turns Pages on for the repository the first time this
      # workflow runs — without it configure-pages fails on a fresh repo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - id: deployment
        uses: actions/deploy-pages@v4
